on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: Render Page

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: plotting_tools
          cache-environment: true
          init-shell: bash

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Point Quarto at conda Python
        run: |
          echo "QUARTO_PYTHON=${CONDA_PREFIX}/bin/python" >> "$GITHUB_ENV"
          "${CONDA_PREFIX}/bin/python" -c "import nbformat, jupyter; print('jupyter ok:', '${CONDA_PREFIX}/bin/python')"

      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
