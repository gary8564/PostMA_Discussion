title-slide-attributes:
  data-background-image: "/assets/rad_img.png"
  data-background-size: contain
  data-background-opacity: "0.1"

output-file: index.html
standalone: true
embed-resources: true
# MathJax 2 with embed-resources breaks MathMenu/MathZoom (404 on /extensions/*.js).
# KaTeX is the supported self-contained math engine for revealjs.
html-math-method: katex
fig-cap-location: margin
from: markdown+emoji+task_lists
format:
  revealjs:
    theme:
      - night
    css:
      - ../slides.css
    # Load Plotly once in the document head. Embedding the full bundle inside a
    # notebook cell moves that cell's graph div outside its Reveal <section>.
    include-in-header:
      - text: |
          <script src="https://cdn.plot.ly/plotly-3.7.0.min.js" charset="utf-8"></script>
    logo: ../../assets/TruhnLab.png
    toc-title: "Today" # title of the table of contents
    toc: false # whether or not to automatically generate a a table of contents based on the headings in the slide
    toc-depth: 1
    number-sections: false # whether or not to number the sections
    slide-number: c/t
    progress: true
    history: false # clicking back in the browser will not go back to the previous slide
    show-slide-number: all
    controls: true
    keyboard: true
    # Reveal 5 automatically enters Scroll View on narrow browser panes.
    # Disable that behavior so the GitHub Pages deck remains slide-based.
    scroll-activation-width: 0
    scrollable: false
    code-fold: true
    width: 1280
    height: 720
    margin: 0.075
    margin-top: 0px
    margin-left: 0px
    fontsize: 18pt
    menu:
      side: left
    preview-links: false
    link-external-newwindow: true
    navigation-mode: linear

execute:
  eval: true
  cache: false
  freeze: auto
