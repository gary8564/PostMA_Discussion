logo:
  small:
    light: assets/TruhnLab.png
    dark: assets/TruhnLab.png
  medium:
    light: assets/TruhnLab.png
    dark: assets/TruhnLab.png
  large: assets/TruhnLab.png

color:
  palette:
    # =========================================================================
    # RWTH Aachen University — Official Color Palette
    # Source: https://git.rwth-aachen.de/philipp.leibner/rwthcolors/-/blob/master/CSS/rwth-colors.css
    # =========================================================================

    # Blue (Blau) — Primary institutional color
    rwth-blue-100: "#00549F"
    rwth-blue-75: "#407FB7"
    rwth-blue-50: "#8EBAE5"
    rwth-blue-25: "#C7DDF2"
    rwth-blue-10: "#E8F1FA"

    # Black (Schwarz)
    black: "#222222"
    rwth-black-100: "#000000"
    rwth-black-75: "#646567"
    rwth-black-50: "#9C9E9F"
    rwth-black-25: "#CFD1D2"
    rwth-black-10: "#ECEDED"

    # Magenta
    rwth-magenta-100: "#E30066"
    rwth-magenta-75: "#E96088"
    rwth-magenta-50: "#F19EB1"
    rwth-magenta-25: "#F9D2DA"
    rwth-magenta-10: "#FDEEF0"

    # Yellow (Gelb)
    rwth-yellow-100: "#FFED00"
    rwth-yellow-75: "#FFF055"
    rwth-yellow-50: "#FFF59B"
    rwth-yellow-25: "#FFFAD1"
    rwth-yellow-10: "#FFFDEE"

    # Petrol (Teal)
    rwth-petrol-100: "#006165"
    rwth-petrol-75: "#2D7F83"
    rwth-petrol-50: "#7DA4A7"
    rwth-petrol-25: "#BFD0D1"
    rwth-petrol-10: "#E6ECEC"

    # Turquoise (Türkis)
    rwth-turquoise-100: "#0098A1"
    rwth-turquoise-75: "#00B1B7"
    rwth-turquoise-50: "#89CCCF"
    rwth-turquoise-25: "#CAE7E7"
    rwth-turquoise-10: "#EBF6F6"

    # Green (Grün)
    rwth-green-100: "#57AB27"
    rwth-green-75: "#8DC060"
    rwth-green-50: "#B8D698"
    rwth-green-25: "#DDEBCE"
    rwth-green-10: "#F2F7EC"

    # May Green (Maigrün)
    rwth-maygreen-100: "#BDCD00"
    rwth-maygreen-75: "#D0D95C"
    rwth-maygreen-50: "#E0E69A"
    rwth-maygreen-25: "#F0F3D0"
    rwth-maygreen-10: "#F9FAED"

    # Orange
    rwth-orange-100: "#F6A800"
    rwth-orange-75: "#FABE50"
    rwth-orange-50: "#FDD48F"
    rwth-orange-25: "#FEEAC9"
    rwth-orange-10: "#FFF7EA"

    # Red (Rot)
    rwth-red-100: "#CC071E"
    rwth-red-75: "#D85C41"
    rwth-red-50: "#E69679"
    rwth-red-25: "#F3CDBB"
    rwth-red-10: "#FAEBE3"

    # Maroon/Bordeaux (Bordeaux)
    rwth-maroon-100: "#A11035"
    rwth-maroon-75: "#B65256"
    rwth-maroon-50: "#CD8B87"
    rwth-maroon-25: "#E5C5C0"
    rwth-maroon-10: "#F5E8E5"

    # Violet (Violett)
    rwth-violet-100: "#612158"
    rwth-violet-75: "#834E75"
    rwth-violet-50: "#A8859E"
    rwth-violet-25: "#D2C0CD"
    rwth-violet-10: "#EDE5EA"

    # Lilac (Lila)
    rwth-lilac-100: "#7A6FAC"
    rwth-lilac-75: "#9B91C1"
    rwth-lilac-50: "#BCB5D7"
    rwth-lilac-25: "#DEDAEB"
    rwth-lilac-10: "#F2F0F7"

    white: "#FFFFFF"

  foreground:
    light: rwth-black-100
    dark: white
  background:
    light: white
    dark: black
  primary:
    light: rwth-blue-100
    dark: rwth-blue-50
  secondary:
    light: rwth-petrol-100
    dark: rwth-turquoise-100
  tertiary:
    light: rwth-black-100
    dark: white
  success:
    light: rwth-green-75
    dark: rwth-green-100
  info:
    light: rwth-turquoise-100
    dark: rwth-turquoise-100
  warning:
    light: rwth-orange-100
    dark: rwth-orange-100
  danger:
    light: rwth-red-100
    dark: rwth-red-100
  light:
    light: rwth-blue-10
    dark: "#2D3748"
  dark:
    light: "#4A5568"
    dark: "#1A202C"

typography:
  fonts:
    - family: Roboto
      source: google
      weight: [400, 700]
      style: [normal, italic]
    - family: Fira Code
      source: google

  base:
    family: Roboto

  headings:
    family: Roboto
    weight: 700

  monospace:
    family: Fira Code
    size: 0.9em

  link:
    color: "#18bc9c"

defaults:
  bootstrap:
    # Bootstrap variable definitions for the website layout
    # See: https://getbootstrap.com/docs/5.3/customize/sass/
    defaults:
      link-decoration: underline
      navbar-bg: "#E8F1FA"
      footer-bg: "#E8F1FA"
      popover-bg: "#FFFFFF"
      input-bg: "#FFFFFF"
      dropdown-bg: "#FFFFFF"
      dropdown-color: "#407FB7"
      dropdown-link-color: "#407FB7"
      dropdown-link-hover-bg: "#E8F1FA"
      dropdown-link-hover-color: "#000000"
  quarto:
    format:
      # basic format-specific settings for the website layout
      html:
        theme:
          light: sandstone
          dark: cyborg
        toc: true # Enable TOC globally
        toc-depth: 5 # Include up to level-5 headings (##)
        toc-location: left # Position TOC on the left
        toc-float: true # Make TOC float as you scroll
        number-sections: true # Add section numbers (e.g., 1, 1.1)
        code-copy: true
        from: markdown+emoji
        link-external-icon: true
        link-external-newwindow: true
        code-block-bg: true
        code-block-border-left: primary
        highlight-style: github
        html-math-method: mathjax
        include-in-header:
          - text: |
              <script>
              MathJax = {
                tex: {
                  tags: 'ams'
                }
              };
              </script>
      revealjs:
        logo: assets/TruhnLab.png
